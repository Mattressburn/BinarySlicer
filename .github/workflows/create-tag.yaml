
name: Create tag (today)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create date-based tag and push
        run: |
          date_tag="v$(date +'%Y.%m.%d')"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$date_tag" -m "Automated tag $date_tag"
          git push origin "$date_tag"
